<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Nouveauté sur LionFlow AI</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f0fdf4;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f0fdf4; padding: 40px 0"
    >
      <tr>
        <td align="center">
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
              background: #fff;
              border-radius: 12px;
              box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
              overflow: hidden;
            "
          >
            <tr>
              <td
                style="
                  background: linear-gradient(135deg, #10b981 0%, #0ea5e9 100%);
                  padding: 40px;
                  text-align: center;
                "
              >
                <h1 style="color: #fff; margin: 0; font-size: 28px">
                  🚀 Quoi de neuf ?
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 40px 30px">
                <p style="color: #374151; font-size: 16px; line-height: 1.6">
                  Bonjour <strong>{{ user.full_name }}</strong>,
                </p>

                <h2 style="color: #065f46; margin-top: 20px">{{ title }}</h2>

                <div
                  style="
                    color: #374151;
                    font-size: 16px;
                    line-height: 1.6;
                    margin-bottom: 30px;
                  "
                >
                  {{ message | safe }}
                </div>

                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  style="margin: 30px 0"
                >
                  <tr>
                    <td align="center">
                      <a
                        href="{{ cta_url }}"
                        style="
                          background: #10b981;
                          color: #fff;
                          padding: 14px 32px;
                          text-decoration: none;
                          border-radius: 8px;
                          font-weight: bold;
                          display: inline-block;
                          font-size: 16px;
                        "
                      >
                        {{ cta_text }}
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                style="
                  background: #f9fafb;
                  padding: 20px 30px;
                  text-align: center;
                "
              >
                <p style="color: #6b7280; font-size: 12px; margin: 0">
                  © 2026 {{ app_name }} — Tous droits réservés.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
