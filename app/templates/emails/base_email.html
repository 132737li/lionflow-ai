<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}LionFlow AI{% endblock %}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: &quot;Segoe UI&quot;, Arial, sans-serif;
      background: #f4f6f9;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f4f6f9; padding: 30px 15px"
    >
      <tr>
        <td align="center">
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
              background: #ffffff;
              border-radius: 10px;
              overflow: hidden;
              box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  background: linear-gradient(135deg, #0d6efd, #0a58ca);
                  padding: 30px;
                  text-align: center;
                "
              >
                <h1
                  style="
                    color: #ffffff;
                    margin: 0;
                    font-size: 24px;
                    letter-spacing: 1px;
                  "
                >
                  🦁 LionFlow AI
                </h1>
              </td>
            </tr>

            <!-- Content -->
            <tr>
              <td
                style="
                  padding: 30px;
                  color: #333333;
                  font-size: 15px;
                  line-height: 1.6;
                "
              >
                {% block content %}{% endblock %}
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  background: #f8f9fa;
                  padding: 20px;
                  text-align: center;
                  font-size: 12px;
                  color: #6c757d;
                  border-top: 1px solid #e9ecef;
                "
              >
                © 2026 LionFlow AI — Burundi 🇧🇮<br />
                Vous recevez cet email car vous avez un compte LionFlow AI.<br />
                <a href="#" style="color: #0d6efd; text-decoration: none"
                  >Gérer mes préférences</a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
