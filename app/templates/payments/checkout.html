{% extends "base.html" %}
{% block title %}Paiement — LionFlow AI{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 500px;">
  <div class="card shadow-sm border-0">
    <div class="card-body text-center p-5">
      <i class="bi bi-credit-card fs-1 text-primary mb-3"></i>
      <h3 class="fw-bold">Paiement sécurisé</h3>
      <p class="text-muted">Vous allez être redirigé vers Dusupay pour finaliser votre paiement.</p>
      <div class="alert alert-info">
        <strong>Montant à payer :</strong> {{ amount }} BIF
      </div>
      <a href="{{ url_for('payments.checkout', plan_name=plan) }}" class="btn btn-primary w-100">
        <i class="bi bi-shield-lock"></i> Continuer vers le paiement
      </a>
    </div>
  </div>
</div>
{% endblock %}
