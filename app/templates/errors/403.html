{% extends "base.html" %}
{% block title %}Accès refusé — LionFlow AI{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 text-warning">403</h1>
    <h2 class="h3 mb-3">Accès refusé</h2>
    <p class="text-muted">{{ message or "Vous n'avez pas les droits pour accéder à cette page." }}</p>
    <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}"
       class="btn btn-primary">Retour</a>
</div>
{% endblock %}
{% block auth_content %}
<div class="text-center py-5">
    <h1 class="display-1 text-warning">403</h1>
    <h2 class="h3 mb-3">Accès refusé</h2>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Se connecter</a>
</div>
{% endblock %}
