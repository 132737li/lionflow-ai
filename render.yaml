databases:
  - name: lionflow-db
    plan: free
    databaseName: lionflow
    user: lionflow_user

services:
  - type: redis
    name: lionflow-redis
    plan: free
    ipAllowList: []

  - type: web
    name: lionflow-ai
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lionflow-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: lionflow-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: lionflow-redis
          property: connectionString
      - key: CELERY_ENABLED
        value: "true"
      - key: FLASK_ENV
        value: "production"
